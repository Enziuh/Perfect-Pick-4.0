name: Verify and deploy Perfect Pick frontend

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Synthetic rollback or separately approved existing JSON API'
        type: choice
        options: [synthetic, api]
        default: synthetic

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved development content and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact synthetic publication artifact
        run: node tools/security/public-artifact.cjs stage
      - name: Required offline security and browser tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test tests/*.test.cjs
      - name: Build separately approved API profile
        if: inputs.profile == 'api'
        env:
          PP4_PUBLIC_API_URL: ${{ vars.PP4_PUBLIC_API_URL }}
          PP4_API_PUBLICATION_APPROVAL: ${{ vars.PP4_API_PUBLICATION_APPROVAL }}
          PP4_PUBLIC_FORM_URL: ${{ vars.PP4_PUBLIC_FORM_URL }}
          PP4_FORM_PUBLICATION_APPROVAL: ${{ vars.PP4_FORM_PUBLICATION_APPROVAL }}
        run: node tools/api/pages-artifact.cjs stage
      - name: Verify unchanged staged artifact immediately before upload
        env:
          PROFILE: ${{ inputs.profile }}
          PP4_PUBLIC_API_URL: ${{ vars.PP4_PUBLIC_API_URL }}
          PP4_API_PUBLICATION_APPROVAL: ${{ vars.PP4_API_PUBLICATION_APPROVAL }}
          PP4_PUBLIC_FORM_URL: ${{ vars.PP4_PUBLIC_FORM_URL }}
          PP4_FORM_PUBLICATION_APPROVAL: ${{ vars.PP4_FORM_PUBLICATION_APPROVAL }}
        run: |
          if [ "$PROFILE" = "api" ]; then
            node tools/api/pages-artifact.cjs verify
          elif [ "$PROFILE" = "synthetic" ]; then
            node tools/security/public-artifact.cjs verify
          else
            exit 1
          fi
      - name: Upload only verified publication artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.preview-public

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy previously verified artifact without checkout or rebuild
        id: deployment
        uses: actions/deploy-pages@v4
