name: Verify and deploy synthetic preview

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout approved development content and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact synthetic publication artifact
        run: node tools/security/public-artifact.cjs stage
      - name: Required offline security and browser tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node --test tests/*.test.cjs
      - name: Verify unchanged staged artifact immediately before upload
        run: node tools/security/public-artifact.cjs verify
      - name: Upload only verified publication artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.preview-public

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy previously verified artifact without checkout or rebuild
        id: deployment
        uses: actions/deploy-pages@v4
